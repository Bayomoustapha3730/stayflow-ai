services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayflow_ai}
      POSTGRES_USER: ${POSTGRES_USER:-stayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - stayflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stayflow-production

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${STAYFLOW_BACKEND_IMAGE:-stayflow-api:local}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-stayflow_ai};Username=${POSTGRES_USER:-stayflow};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      Jwt__Issuer: ${JWT_ISSUER:-StayFlow.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-StayFlow.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:8081}
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN_ALT:-http://127.0.0.1:8081}
      ProductionHardening__Security__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:8081}
      ProductionHardening__Security__AllowedOrigins__1: ${FRONTEND_ORIGIN_ALT:-http://127.0.0.1:8081}
      ProductionHardening__Security__AllowLocalOrigins: true
      AIProvider__Provider: ${AI_PROVIDER:-Development}
      WhatsAppCloud__Enabled: ${WHATSAPP_CLOUD_ENABLED:-false}
      WhatsAppCloud__DevelopmentMode: ${WHATSAPP_DEVELOPMENT_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - stayflow-production

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${STAYFLOW_FRONTEND_IMAGE:-stayflow-web:local}
    environment:
      STAYFLOW_API_URL: ${STAYFLOW_API_URL:-http://localhost:8080}
      STAYFLOW_SIGNALR_URL: ${STAYFLOW_SIGNALR_URL:-http://localhost:8080/hubs/conversations}
      STAYFLOW_ENVIRONMENT: ${STAYFLOW_ENVIRONMENT:-production}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - stayflow-production

volumes:
  stayflow-postgres-data:

networks:
  stayflow-production:
    driver: bridge
